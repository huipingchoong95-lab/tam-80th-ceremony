<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TAM Penang 80th Anniversary — Wall of Names</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #040914; overflow: hidden; font-family: sans-serif; cursor: default; }
  canvas { position: absolute; top: 0; left: 0; }
  #bg { z-index: 1; }
  #base { z-index: 2; }
  #fx { z-index: 3; pointer-events: none; }
  
  #hud {
    position: absolute; top: 32px; left: 36px; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    background: rgba(10, 20, 35, 0.7); backdrop-filter: blur(12px);
    padding: 16px 28px; border-radius: 40px; border: 1px solid rgba(0, 255, 204, 0.3);
    color: #e0f2fe; font-size: 22px; font-weight: 600;
    box-shadow: 0 4px 24px rgba(0, 255, 204, 0.15);
  }
  #counter { color: #00ffcc; font-size: 32px; font-weight: 800; text-shadow: 0 0 10px rgba(0,255,204,0.5); }

  #qr-hud {
    position: absolute; top: 32px; right: 36px; z-index: 10;
    background: rgba(10, 20, 35, 0.7); backdrop-filter: blur(12px);
    padding: 20px; border-radius: 20px; border: 1px solid rgba(0, 255, 204, 0.3);
    text-align: center; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: 0 4px 24px rgba(0, 255, 204, 0.15);
  }
  #qr-hud img { width: 220px; height: 220px; border-radius: 12px; background: #fff; padding: 6px; }
  #qr-hud span { font-size: 16px; font-weight: 600; color: #00ffcc; letter-spacing: 0.5px; }

  #watermark {
    position: absolute; bottom: 16px; right: 28px; z-index: 10;
    color: rgba(0, 255, 204, 0.45); font-size: 13px; font-weight: 500;
    letter-spacing: 0.5px; pointer-events: none;
    text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="base"></canvas>
  <canvas id="fx"></canvas>

  <div id="hud">
    <span>Nodes Connected:</span>
    <span id="counter">0</span>
  </div>

  <div id="qr-hud">
    <img id="qr-img" src="" alt="Scan QR">
    <span>Scan to Join Network</span>
  </div>
  
  <div id="watermark">Designed & Developed by Ts. Choong Hui Ping</div>

<script>
const PALETTE = ['#ffffff', '#f2c14e', '#fbbf24', '#ff77ff', '#ffaa33', '#ff3366', '#ffdd55'];
const FEATURED_COLOR = '#f2c14e';
const SHAPE_TEXT = '80';
const TITLE_LINE1 = '80th Anniversary';
const TITLE_LINE2 = 'TAM Penang';
const FIREWORK_WORDS = ['80', 'TAM', '2027'];

const ZOOM_IN_MS = 900;
const ZOOM_HOLD_MS = 2200;
const ZOOM_OUT_MS = 900;
const TITLE_IN_MS = 1200;

const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

// Aggressive auto-unlock for browser audio policies
function unlockAudio() {
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  // Play a silent micro-buffer to force-unlock audio routing in Chrome/Safari
  try {
    const buffer = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
    const channel = buffer.getChannelData(0);
    channel[0] = 0;
    const node = audioCtx.createBufferSource();
    node.buffer = buffer;
    node.connect(audioCtx.destination);
    node.start(0);
  } catch(e) {}
}

// Listen for any interaction to ensure audio is instantly active
['click', 'touchstart', 'keydown', 'pointerdown', 'mousemove'].forEach(evt => {
  document.addEventListener(evt, unlockAudio, { once: true, passive: true });
});

// Try unlocking immediately on load
window.addEventListener('load', unlockAudio);

// Load custom Grand_Gala_Fanfare.mp3 via Web Audio API buffer
let titleAudioBuffer = null;
let titleAudioSource = null;

fetch('./Grand_Gala_Fanfare.mp3')
  .then(res => res.arrayBuffer())
  .then(data => audioCtx.decodeAudioData(data))
  .then(buffer => { titleAudioBuffer = buffer; })
  .catch(() => console.log('Custom title audio file Grand_Gala_Fanfare.mp3 not found.'));

function startTitleBGM() {
  unlockAudio();
  if (!titleAudioBuffer) return;
  stopTitleBGM();

  titleAudioSource = audioCtx.createBufferSource();
  titleAudioSource.buffer = titleAudioBuffer;
  titleAudioSource.loop = true; // Seamless loop
  
  const gainNode = audioCtx.createGain();
  gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime);
  
  titleAudioSource.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  titleAudioSource.start(0);
}

function stopTitleBGM() {
  if (titleAudioSource) {
    try { titleAudioSource.stop(); titleAudioSource.disconnect(); } catch(e){}
    titleAudioSource = null;
  }
}

function playBoom() {
  unlockAudio();
  const bufferSize = audioCtx.sampleRate * 1.2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(600, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 1.2);
  
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
  
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start();
}

function playLaserBlip() {
  unlockAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(800, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.25);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.25);
}

const tamLogo = new Image();
tamLogo.onload = () => { if (titleAnim) ensureLoop(); };
tamLogo.src = './tam-logo.png';

const bgCanvas = document.getElementById('bg');
const baseCanvas = document.getElementById('base');
const fxCanvas = document.getElementById('fx');
const bgCtx = bgCanvas.getContext('2d');
const baseCtx = baseCanvas.getContext('2d');
const fxCtx = fxCanvas.getContext('2d');
const counterEl = document.getElementById('counter');

let W = 0, H = 0, DPR = 1;
let slots = [], placed = new Map(), slotIndex = 0;
let incomingPackets = [], loopRunning = false;
let dimAlpha = 0, zoomAnim = null, titleAnim = null;
let fireworks = [], particles = [], sparklers = [], titleStardust = [], netNodes = [];
let shapePointsMap = {}, sequenceIndex = 0, fireworkTimer = 0;

for(let i=0; i<85; i++) {
  netNodes.push({ x: Math.random(), y: Math.random(), vx: (Math.random()-0.5)*0.001, vy: (Math.random()-0.5)*0.001 });
}

function generateShapePoints() {
  shapePointsMap = {};
  const boxW = 400, boxH = 200;
  const off = document.createElement('canvas');
  off.width = boxW; off.height = boxH;
  const octx = off.getContext('2d');
  
  for (const word of FIREWORK_WORDS) {
    octx.clearRect(0, 0, boxW, boxH);
    const fontPx = Math.min(W * 0.12, 85);
    octx.font = `bold ${fontPx}px Arial, sans-serif`;
    octx.textAlign = 'center'; octx.textBaseline = 'middle';
    octx.fillStyle = '#fff';
    octx.fillText(word, boxW / 2, boxH / 2);

    const img = octx.getImageData(0, 0, boxW, boxH).data;
    const points = [];
    const step = 3;
    for (let y = 0; y < boxH; y += step) {
      for (let x = 0; x < boxW; x += step) {
        if (img[(y * boxW + x) * 4 + 3] > 128) {
          points.push({ dx: x - boxW / 2, dy: y - boxH / 2 });
        }
      }
    }
    shapePointsMap[word] = points;
  }
}

class Sparkle {
  constructor(cx, cy, spread = 220) {
    this.cx = cx;
    this.cy = cy;
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * spread + 10;
    this.x = cx + Math.cos(angle) * radius;
    this.y = cy + Math.sin(angle) * radius;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = (Math.random() - 0.5) * 1.5 - 0.3;
    this.size = Math.random() * 3 + 1;
    this.alpha = 1;
    this.decay = Math.random() * 0.025 + 0.012;
    this.color = Math.random() > 0.3 ? '#f2c14e' : '#ffffff';
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
  }
  draw() {
    if (this.alpha <= 0) return;
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, this.alpha);
    fxCtx.fillStyle = this.color;
    fxCtx.shadowColor = this.color;
    fxCtx.shadowBlur = 10;
    fxCtx.beginPath();
    fxCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    fxCtx.fill();
    fxCtx.restore();
  }
}

class TitleStardust {
  constructor() {
    this.x = Math.random() * W;
    this.y = H + 20;
    this.vx = (Math.random() - 0.5) * 1.2;
    this.vy = -(Math.random() * 2.5 + 1.2);
    this.size = Math.random() * 3.5 + 1;
    this.alpha = Math.random() * 0.8 + 0.2;
    this.decay = Math.random() * 0.012 + 0.005;
    this.color = Math.random() > 0.4 ? '#f2c14e' : (Math.random() > 0.5 ? '#ffffff' : '#00ffcc');
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
  }
  draw() {
    if (this.alpha <= 0) return;
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, this.alpha);
    fxCtx.fillStyle = this.color;
    fxCtx.shadowColor = this.color;
    fxCtx.shadowBlur = 12;
    fxCtx.beginPath();
    fxCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    fxCtx.fill();
    fxCtx.restore();
  }
}

class IncomingPacket {
  constructor(wordObj) {
    this.wordObj = wordObj;
    this.startX = wordObj.x + (Math.random() * 200 - 100);
    this.startY = -80;
    this.x = this.startX;
    this.y = this.startY;
    this.targetX = wordObj.x;
    this.targetY = wordObj.y;
    this.speed = 4.5;
    this.trail = [];
    this.fading = false;
    this.trailAlpha = 1;
    this.alive = true;
  }
  update() {
    if (!this.fading) {
      let dx = this.targetX - this.x;
      let dy = this.targetY - this.y;
      let dist = Math.hypot(dx, dy);

      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 40) this.trail.shift();

      if (dist < this.speed) {
        this.fading = true;
        playLaserBlip();
        stampWord(baseCtx, this.wordObj, 1);
      } else {
        this.x += (dx / dist) * this.speed;
        this.y += (dy / dist) * this.speed;
      }
    } else {
      this.trailAlpha -= 0.04;
      if (this.trailAlpha <= 0) this.alive = false;
    }
  }
  draw() {
    if (this.trail.length > 1 && this.trailAlpha > 0) {
      fxCtx.save();
      const isVip = this.wordObj.featured;
      fxCtx.strokeStyle = isVip ? `rgba(242, 193, 78, ${Math.max(0, 0.9 * this.trailAlpha)})` : `rgba(0, 255, 204, ${Math.max(0, 0.8 * this.trailAlpha)})`;
      fxCtx.lineWidth = isVip ? 4 : 2.5;
      fxCtx.shadowColor = isVip ? '#f2c14e' : '#00ffcc';
      fxCtx.shadowBlur = 14;
      fxCtx.beginPath();
      fxCtx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let t of this.trail) fxCtx.lineTo(t.x, t.y);
      fxCtx.stroke();
      fxCtx.restore();
    }

    if (!this.fading) {
      fxCtx.save();
      fxCtx.translate(this.x, this.y);
      fxCtx.textAlign = 'center';
      fxCtx.textBaseline = 'middle';
      const isVip = this.wordObj.featured;
      fxCtx.font = `${isVip ? '800' : '700'} ${Math.max(10, this.wordObj.fontPx * 1.1)}px Arial, sans-serif`;
      fxCtx.fillStyle = isVip ? '#f2c14e' : '#ffffff';
      fxCtx.shadowColor = isVip ? '#f2c14e' : '#00ffcc';
      fxCtx.shadowBlur = 12;
      fxCtx.fillText(this.wordObj.name, 0, 0);
      fxCtx.restore();
    }
  }
}

class Firework {
  constructor(word) {
    this.x = Math.random() * (W * 0.65) + (W * 0.175);
    this.y = H;
    this.targetY = Math.random() * (H * 0.35) + (H * 0.15);
    this.speed = Math.random() * 3 + 8;
    this.color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    this.word = word;
    this.alive = true;
  }
  update() {
    this.y -= this.speed;
    if (this.y <= this.targetY) { 
      this.alive = false; 
      this.explode(); 
    }
  }
  explode() {
    playBoom();
    const points = shapePointsMap[this.word];
    if (!points || points.length === 0) return;

    const count = Math.min(points.length, 260);
    const shuffled = [...points].sort(() => Math.random() - 0.5);

    for (let i = 0; i < count; i++) {
      const pt = shuffled[i % shuffled.length];
      particles.push(new ShapeParticle(this.x, this.targetY, this.x + pt.dx, this.targetY + pt.dy, this.color));
    }
  }
  draw() {
    fxCtx.fillStyle = this.color;
    fxCtx.beginPath(); fxCtx.arc(this.x, this.y, 3, 0, Math.PI * 2); fxCtx.fill();
  }
}

class ShapeParticle {
  constructor(startX, startY, targetX, targetY, color) {
    this.x = startX; this.y = startY;
    this.targetX = targetX; this.targetY = targetY;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 7 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.alpha = 1; this.color = color;
    this.phase = 'burst'; this.timer = 0;
  }
  update() {
    this.timer++;
    if (this.phase === 'burst') {
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.88; this.vy *= 0.88;
      if (this.timer > 18) this.phase = 'forming';
    } else {
      this.x += (this.targetX - this.x) * 0.12;
      this.y += (this.targetY - this.y) * 0.12;
      if (this.timer > 110) this.alpha -= 0.025;
    }
  }
  draw() {
    if (this.alpha <= 0) return;
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, this.alpha);
    fxCtx.fillStyle = this.color;
    fxCtx.shadowColor = this.color;
    fxCtx.shadowBlur = 8;
    fxCtx.beginPath(); fxCtx.arc(this.x, this.y, 2.2, 0, Math.PI * 2); fxCtx.fill();
    fxCtx.restore();
  }
}

fetch('/api/qr').then(res => res.json()).then(data => { document.getElementById('qr-img').src = data.qr; });

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [bgCanvas, baseCanvas, fxCanvas]) {
    c.width = W * DPR; c.height = H * DPR;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    c.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  generateShapePoints();
  rebuildSlotsAndRedraw();
}
window.addEventListener('resize', resize);

function animateBg() {
  bgCtx.clearRect(0, 0, W, H);
  bgCtx.lineWidth = 2;
  
  for(let i=0; i<netNodes.length; i++) {
    let n = netNodes[i];
    n.x += n.vx; n.y += n.vy;
    if(n.x < 0 || n.x > 1) n.vx *= -1;
    if(n.y < 0 || n.y > 1) n.vy *= -1;
    
    let px = n.x * W, py = n.y * H;
    bgCtx.fillStyle = '#00ffcc';
    bgCtx.shadowColor = 'rgba(0, 255, 204, 0.8)';
    bgCtx.shadowBlur = 6;
    bgCtx.beginPath(); bgCtx.arc(px, py, 3, 0, Math.PI*2); bgCtx.fill();
    bgCtx.shadowBlur = 0;
    
    for(let j=i+1; j<netNodes.length; j++) {
      let n2 = netNodes[j];
      let p2x = n2.x * W, p2y = n2.y * H;
      let dist = Math.hypot(px - p2x, py - p2y);
      if(dist < 180) {
        bgCtx.strokeStyle = `rgba(0, 255, 204, ${0.35 * (1 - dist/180)})`;
        bgCtx.beginPath(); bgCtx.moveTo(px, py); bgCtx.lineTo(p2x, p2y); bgCtx.stroke();
      }
    }
  }
  requestAnimationFrame(animateBg);
}
requestAnimationFrame(animateBg);

function buildSlots(targetCount = 50) {
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const octx = off.getContext('2d');
  const fontPx = Math.min(H * 0.88, W * 0.72);
  
  octx.save();
  octx.translate((W / 2) - (W * 0.035), (H / 2) + (H * 0.04));
  octx.scale(1.35, 1.0); 
  octx.font = `bold ${fontPx}px Arial, sans-serif`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = '#fff';
  octx.fillText(SHAPE_TEXT, 0, 0);
  octx.restore();

  const img = octx.getImageData(0, 0, W, H).data;
  let cellSize = 30;
  if (targetCount > 500) cellSize = 14;
  else if (targetCount > 300) cellSize = 16;
  else if (targetCount > 150) cellSize = 20;
  else if (targetCount > 70) cellSize = 26;
  
  cellSize = Math.max(10, Math.floor(cellSize));
  const rawPoints = [];

  for (let y = cellSize / 2; y < H; y += cellSize) {
    for (let x = cellSize / 2; x < W; x += cellSize) {
      if (img[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 128) {
        rawPoints.push({ x, y });
      }
    }
  }

  if (targetCount > rawPoints.length) {
    const marginGridStep = 45;
    for (let y = 60; y < H - 60; y += marginGridStep) {
      for (let x = 60; x < W - 60; x += marginGridStep) {
        const inHud = (x < 320 && y < 140);
        const inQr = (x > W - 320 && y < 320);
        const inCenterCore = img[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 128;
        
        if (!inHud && !inQr && !inCenterCore) {
          rawPoints.push({ 
            x: x + (Math.random() * 20 - 10), 
            y: y + (Math.random() * 20 - 10) 
          });
        }
      }
    }
  }

  const result = [];
  
  // Dynamic padding to prevent overlapping when node count is low and text is large
  let minSpacing = 26;
  if (targetCount <= 20) minSpacing = 95;
  else if (targetCount <= 50) minSpacing = 65;
  else if (targetCount > 400) minSpacing = 14;
  else if (targetCount > 200) minSpacing = 18;

  for (let pt of rawPoints) {
    let tooClose = false;
    for (let existing of result) {
      if (Math.hypot(pt.x - existing.x, pt.y - existing.y) < minSpacing) {
        tooClose = true;
        break;
      }
    }
    if (!tooClose) result.push(pt);
  }

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function getTargetFontSize(totalCount) {
  if (totalCount <= 5) return Math.min(W * 0.035, 45);
  if (totalCount <= 15) return Math.min(W * 0.026, 34);
  if (totalCount <= 35) return Math.min(W * 0.020, 26);
  if (totalCount <= 70) return Math.min(W * 0.015, 20);
  if (totalCount <= 120) return Math.min(W * 0.011, 15);
  if (totalCount <= 200) return Math.min(W * 0.009, 12);
  if (totalCount <= 350) return Math.min(W * 0.0075, 10);
  if (totalCount <= 550) return Math.min(W * 0.006, 8.5);
  return Math.min(W * 0.0048, 7);
}

function checkIsPresident(name, featured) {
  if (featured === true || featured === 'true' || featured === 1) return true;
  return false;
}

function rebuildSlotsAndRedraw() {
  slots = buildSlots(placed.size); 
  slotIndex = 0;
  const entries = Array.from(placed.values());
  placed.clear();
  baseCtx.clearRect(0, 0, W, H);
  drawIdleOutline();
  for (const w of entries) {
    placed.set(w.id, w);
    stampWord(baseCtx, w, 1);
  }
  counterEl.textContent = placed.size;
}

function drawIdleOutline() {
  baseCtx.save();
  const fontPx = Math.min(H * 0.88, W * 0.72);
  baseCtx.translate((W / 2) - (W * 0.035), (H / 2) + (H * 0.04));
  baseCtx.scale(1.35, 1.0); 
  baseCtx.font = `bold ${fontPx}px Arial, sans-serif`;
  baseCtx.textAlign = 'center'; baseCtx.textBaseline = 'middle';
  baseCtx.strokeStyle = 'rgba(0, 255, 204, 0.12)';
  baseCtx.lineWidth = 3;
  baseCtx.shadowColor = 'rgba(0, 255, 204, 0.6)';
  baseCtx.shadowBlur = 15;
  baseCtx.strokeText(SHAPE_TEXT, 0, 0);
  baseCtx.restore();
}

function pickColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return PALETTE[hash % PALETTE.length];
}

function updateAllFontSizesExcept(excludeId) {
  const targetFont = getTargetFontSize(placed.size);
  baseCtx.clearRect(0, 0, W, H);
  drawIdleOutline();
  for (const w of placed.values()) {
    if (w.id === excludeId) continue;
    if (!w.featured) w.fontPx = targetFont;
    stampWord(baseCtx, w, 1);
  }
}

function assignAndDraw(id, name, featured, immediate) {
  if (placed.has(id)) return;

  if (slots.length === 0 || slotIndex >= slots.length || placed.size >= slots.length) {
    slots = buildSlots(placed.size + 1);
    slotIndex = 0;
  }

  const isPres = checkIsPresident(name, featured);
  const slot = slots[slotIndex % slots.length];
  slotIndex++;

  let targetX = slot.x;
  let targetY = slot.y;
  let fontPx = getTargetFontSize(placed.size + 1);

  if (isPres) {
    let featuredCount = 0;
    for (const p of placed.values()) { if (p.featured) featuredCount++; }
    targetX = W / 2;
    targetY = (H * 0.40) + (featuredCount * 70);
    fontPx = Math.max(48, Math.min(W * 0.05, 66));
  }

  const wordObj = { id, name, x: targetX, y: targetY, rot: isPres ? 0 : (Math.random() * 8 - 4) * (Math.PI / 180), color: isPres ? FEATURED_COLOR : pickColor(name), fontPx, featured: isPres };
  placed.set(id, wordObj); 
  counterEl.textContent = placed.size;

  if (immediate) {
    stampWord(baseCtx, wordObj, 1);
  } else {
    updateAllFontSizesExcept(id);
    incomingPackets.push(new IncomingPacket(wordObj));
    ensureLoop();
  }
}

function stampWord(ctx, w, scale) {
  ctx.save(); ctx.translate(w.x, w.y); ctx.rotate(w.rot); ctx.scale(scale, scale);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (w.featured) {
    ctx.font = `800 ${w.fontPx}px Arial, sans-serif`;
    ctx.shadowColor = 'rgba(242, 193, 78, 1)'; ctx.shadowBlur = 35; ctx.fillStyle = FEATURED_COLOR;
  } else {
    ctx.font = `700 ${w.fontPx}px Arial, sans-serif`;
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 6; ctx.fillStyle = w.color;
  }
  ctx.fillText(w.name, 0, 0); ctx.restore();
}

function easeOutBack(t) { const c1 = 1.70158; return 1 + (c1 + 1) * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

function loop(now) {
  fxCtx.clearRect(0, 0, W, H);
  let stillActive = false;

  for (const w of placed.values()) {
    if (w.featured) {
      if (Math.random() < 0.25) {
        sparklers.push(new Sparkle(w.x, w.y, 80));
      }
    }
  }

  if (titleAnim) {
    if (Math.random() < 0.7) {
      titleStardust.push(new TitleStardust());
    }
  }

  for (let i = incomingPackets.length - 1; i >= 0; i--) {
    let p = incomingPackets[i];
    p.update();
    p.draw();
    if (!p.alive) incomingPackets.splice(i, 1);
    else stillActive = true;
  }

  if (dimAlpha > 0) {
    fxCtx.save(); fxCtx.fillStyle = `rgba(4,9,20,${dimAlpha})`; fxCtx.fillRect(0, 0, W, H); fxCtx.restore();
  }

  if (zoomAnim) {
    const elapsed = now - zoomAnim.start;
    if (elapsed < ZOOM_IN_MS) {
      dimAlpha = Math.min(0.7, (elapsed / ZOOM_IN_MS) * 0.7);
      drawZoomName(zoomAnim, easeOutBack(Math.min(1, elapsed / ZOOM_IN_MS)), 1); 
      if (Math.random() < 0.6) sparklers.push(new Sparkle(W / 2, H * 0.46, 220));
      stillActive = true;
    } else if (elapsed < ZOOM_IN_MS + ZOOM_HOLD_MS) {
      dimAlpha = 0.7; 
      drawZoomName(zoomAnim, 1, 1); 
      if (Math.random() < 0.8) sparklers.push(new Sparkle(W / 2, H * 0.46, 220));
      stillActive = true;
    } else if (elapsed < ZOOM_IN_MS + ZOOM_HOLD_MS + ZOOM_OUT_MS) {
      const eased = easeInOutCubic((elapsed - ZOOM_IN_MS - ZOOM_HOLD_MS) / ZOOM_OUT_MS);
      dimAlpha = 0.7 * (1 - eased); 
      drawZoomName(zoomAnim, 1, 1 - eased); 
      stillActive = true;
    } else { 
      dimAlpha = 0; 
      for (const w of placed.values()) {
        if (w.featured) stampWord(baseCtx, w, 1);
      }
      zoomAnim = null; 
    }
  }

  for (let i = sparklers.length - 1; i >= 0; i--) {
    sparklers[i].update();
    sparklers[i].draw();
    if (sparklers[i].alpha <= 0) sparklers.splice(i, 1);
  }
  if (sparklers.length > 0) stillActive = true;

  for (let i = titleStardust.length - 1; i >= 0; i--) {
    titleStardust[i].update();
    titleStardust[i].draw();
    if (titleStardust[i].alpha <= 0) titleStardust.splice(i, 1);
  }
  if (titleStardust.length > 0) stillActive = true;

  if (titleAnim) {
    const elapsed = now - titleAnim.start;
    dimAlpha = Math.max(dimAlpha, 0.85);
    
    fireworkTimer++;
    if (fireworkTimer % 75 === 0) {
      const currentWord = FIREWORK_WORDS[sequenceIndex % FIREWORK_WORDS.length];
      fireworks.push(new Firework(currentWord));
      sequenceIndex++;
    }

    drawTitle(easeOutBack(Math.min(1, elapsed / TITLE_IN_MS)));
    stillActive = true;
  } else {
    fireworkTimer = 0;
    sequenceIndex = 0;
    titleStardust = [];
  }

  for (let i = fireworks.length - 1; i >= 0; i--) {
    fireworks[i].update(); fireworks[i].draw();
    if (!fireworks[i].alive) fireworks.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(); particles[i].draw();
    if (particles[i].alpha <= 0) particles[i].alpha = 0; // cleanup handled
  }

  requestAnimationFrame(loop);
}

function ensureLoop() { if (!loopRunning) { loopRunning = true; requestAnimationFrame(loop); } }

function drawZoomName(anim, growT, shrinkT) {
  const bigFontPx = Math.min(H * 0.18, W * 0.10);
  const start = { x: W / 2, y: H / 2, fontPx: bigFontPx * 0.15 }, big = { x: W / 2, y: H * 0.46, fontPx: bigFontPx };
  const end = { x: anim.targetSlot.x, y: anim.targetSlot.y, fontPx: anim.targetFontPx };
  let x = shrinkT === 1 ? start.x + (big.x - start.x) * growT : big.x + (end.x - big.x) * (1 - shrinkT);
  let y = shrinkT === 1 ? start.y + (big.y - start.y) * growT : big.y + (end.y - big.y) * (1 - shrinkT);
  let fontPx = shrinkT === 1 ? start.fontPx + (big.fontPx - start.fontPx) * growT : big.fontPx + (end.fontPx - big.fontPx) * (1 - shrinkT);

  fxCtx.save(); fxCtx.translate(x, y);
  fxCtx.font = `800 ${fontPx}px Arial, sans-serif`;
  fxCtx.textAlign = 'center'; fxCtx.textBaseline = 'middle';
  fxCtx.shadowColor = 'rgba(242, 193, 78, 1)'; fxCtx.shadowBlur = 45;
  fxCtx.fillStyle = FEATURED_COLOR; fxCtx.fillText(anim.name, 0, 0); fxCtx.restore();
}

function drawTitle(t) {
  fxCtx.save(); fxCtx.globalAlpha = Math.min(1, t + 0.15);
  fxCtx.textAlign = 'center'; fxCtx.textBaseline = 'middle';
  
  const auraGrad = fxCtx.createRadialGradient(W / 2, H * 0.45, 20, W / 2, H * 0.45, 380);
  auraGrad.addColorStop(0, 'rgba(242, 193, 78, 0.22)');
  auraGrad.addColorStop(0.5, 'rgba(0, 255, 204, 0.08)');
  auraGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  fxCtx.fillStyle = auraGrad;
  fxCtx.beginPath(); fxCtx.arc(W / 2, H * 0.45, 380, 0, Math.PI * 2); fxCtx.fill();

  if (tamLogo.complete && tamLogo.naturalWidth > 0) {
    const maxLogoW = Math.min(W * 0.4, 380), aspect = tamLogo.naturalHeight / tamLogo.naturalWidth;
    const logoW = maxLogoW * t, logoH = (maxLogoW * aspect) * t, logoY = H * 0.25;
    const pad = 12 * t;
    
    fxCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    if (fxCtx.roundRect) {
      fxCtx.beginPath(); fxCtx.roundRect(W / 2 - logoW / 2 - pad, logoY - logoH / 2 - pad, logoW + pad * 2, logoH + pad * 2, 10); fxCtx.fill();
    } else fxCtx.fillRect(W / 2 - logoW / 2 - pad, logoY - logoH / 2 - pad, logoW + pad * 2, logoH + pad * 2);
    fxCtx.drawImage(tamLogo, W / 2 - logoW / 2, logoY - logoH / 2, logoW, logoH);
  }

  const size1 = (Math.min(H * 0.08, W * 0.055)) * (0.2 + 0.8 * t);
  fxCtx.fillStyle = '#ffffff'; fxCtx.font = `600 ${size1}px Arial, sans-serif`; fxCtx.fillText(TITLE_LINE1, W / 2, H * 0.52);
  fxCtx.fillStyle = FEATURED_COLOR; fxCtx.font = `800 ${size1 * 1.4}px Arial, sans-serif`;
  fxCtx.shadowColor = FEATURED_COLOR; fxCtx.shadowBlur = 25; fxCtx.fillText(TITLE_LINE2, W / 2, H * 0.64);
  fxCtx.restore();
}

const source = new EventSource('/api/events');
source.addEventListener('sync', (e) => {
  const data = JSON.parse(e.data); placed.clear(); slotIndex = 0;
  slots = buildSlots(data.names.length);
  baseCtx.clearRect(0, 0, W, H); drawIdleOutline();
  for (const n of data.names) if (!n.hidden) assignAndDraw(n.id, n.name, n.featured, true);
  if (data.sceneState.state === 'title') {
    titleAnim = { start: performance.now() };
    startTitleBGM();
  } else if (data.sceneState.state === 'collecting') { 
    titleAnim = null; 
    stopTitleBGM();
    zoomAnim = null; 
    dimAlpha = 0; 
  }
  ensureLoop();
});
source.addEventListener('name:new', (e) => assignAndDraw(JSON.parse(e.data).id, JSON.parse(e.data).name, JSON.parse(e.data).featured, false));
source.addEventListener('names:batch', (e) => {
  const batch = JSON.parse(e.data);
  for (const n of batch) {
    if (!n.hidden) assignAndDraw(n.id, n.name, n.featured, false);
  }
});
source.addEventListener('name:deleted', (e) => { 
  const id = JSON.parse(e.data).id;
  placed.delete(id); 
  counterEl.textContent = placed.size;
  rebuildSlotsAndRedraw(); 
});
source.addEventListener('name:reset', () => { 
  placed.clear(); 
  slotIndex = 0; 
  titleAnim = null; 
  stopTitleBGM();
  zoomAnim = null; 
  dimAlpha = 0; 
  counterEl.textContent = '0'; 
  slots = buildSlots(1); 
  baseCtx.clearRect(0, 0, W, H); 
  drawIdleOutline(); 
});

source.addEventListener('scene:change', (e) => {
  const scene = JSON.parse(e.data);
  if (scene.state === 'collecting') {
    titleAnim = null;
    stopTitleBGM();
    zoomAnim = null;
    dimAlpha = 0;
    fxCtx.clearRect(0, 0, W, H);
    fireworks = [];
    particles = [];
    incomingPackets = [];
    titleStardust = [];
  } else if (scene.state === 'zoom') { 
    zoomAnim = { name: scene.payload.name, targetSlot: { x: W / 2, y: H / 2 }, targetFontPx: 85, start: performance.now() }; 
    ensureLoop(); 
  } else if (scene.state === 'title') { 
    titleAnim = { start: performance.now() }; 
    startTitleBGM();
    ensureLoop(); 
  }
});

resize();
ensureLoop();
</script>
