<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TAM Penang 80th Anniversary — Wall of Names</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a1420; overflow: hidden; font-family: sans-serif; }
  canvas { position: absolute; top: 0; left: 0; }
  
  /* Larger Counter HUD */
  #hud {
    position: absolute; top: 32px; left: 36px; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    background: rgba(19, 31, 46, 0.85); backdrop-filter: blur(12px);
    padding: 16px 28px; border-radius: 40px; border: 2px solid rgba(255,255,255,0.2);
    color: #fff; font-size: 22px; font-weight: 600;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }
  #counter { color: #f2c14e; font-size: 32px; font-weight: 800; }

  /* Extra Large QR Badge HUD for Stage Projection */
  #qr-hud {
    position: absolute; top: 32px; right: 36px; z-index: 10;
    background: rgba(19, 31, 46, 0.90); backdrop-filter: blur(12px);
    padding: 20px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.2);
    text-align: center; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }
  #qr-hud img { width: 220px; height: 220px; border-radius: 12px; background: #fff; padding: 6px; }
  #qr-hud span { font-size: 16px; font-weight: 600; color: #dce8f7; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <canvas id="base"></canvas>
  <canvas id="fx"></canvas>

  <div id="hud">
    <span>Participants Joined:</span>
    <span id="counter">0</span>
  </div>

  <div id="qr-hud">
    <img id="qr-img" src="" alt="Scan QR">
    <span>Scan to Join Shape</span>
  </div>

<script>
const PALETTE = ['#ffffff', '#dce8f7', '#9fc4ea'];
const FEATURED_COLOR = '#f2c14e';
const SHAPE_TEXT = '80';
const TITLE_LINE1 = '80th Anniversary';
const TITLE_LINE2 = 'TAM Penang';
const POPIN_MS = 450;
const ZOOM_IN_MS = 900;
const ZOOM_HOLD_MS = 2200;
const ZOOM_OUT_MS = 900;
const TITLE_IN_MS = 1200;

// Preload Official TAM Logo
const tamLogo = new Image();
tamLogo.src = '/tam-logo.png';

const baseCanvas = document.getElementById('base');
const fxCanvas = document.getElementById('fx');
const baseCtx = baseCanvas.getContext('2d');
const fxCtx = fxCanvas.getContext('2d');
const counterEl = document.getElementById('counter');

let W = 0, H = 0, DPR = 1;
let slots = [];
let placed = new Map();
let slotIndex = 0;
let animatingWords = [];
let loopRunning = false;
let banner = null;
let dimAlpha = 0;
let zoomAnim = null;
let titleAnim = null;

// Fireworks System
let fireworks = [];
let particles = [];

class Firework {
  constructor() {
    this.x = Math.random() * W;
    this.y = H;
    this.targetY = Math.random() * (H * 0.4) + (H * 0.1);
    this.speed = Math.random() * 3 + 7;
    this.color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    this.alive = true;
  }
  update() {
    this.y -= this.speed;
    if (this.y <= this.targetY) {
      this.alive = false;
      this.explode();
    }
  }
  explode() {
    const particleCount = 40;
    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle(this.x, this.y, this.color));
    }
  }
  draw() {
    fxCtx.fillStyle = this.color;
    fxCtx.beginPath();
    fxCtx.arc(this.x, this.y, 3, 0, Math.PI * 2);
    fxCtx.fill();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.alpha = 1;
    this.decay = Math.random() * 0.02 + 0.015;
    this.color = color;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.08;
    this.alpha -= this.decay;
  }
  draw() {
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, this.alpha);
    fxCtx.fillStyle = this.color;
    fxCtx.beginPath();
    fxCtx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
    fxCtx.fill();
    fxCtx.restore();
  }
}

// Fetch QR Code
fetch('/api/qr')
  .then(res => res.json())
  .then(data => {
    document.getElementById('qr-img').src = data.qr;
  });

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  for (const c of [baseCanvas, fxCanvas]) {
    c.width = W * DPR;
    c.height = H * DPR;
    c.style.width = W + 'px';
    c.style.height = H + 'px';
  }
  baseCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fxCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  rebuildSlotsAndRedraw();
}
window.addEventListener('resize', resize);

function buildSlots() {
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  octx.clearRect(0, 0, W, H);
  const fontPx = Math.min(H * 0.78, W * 0.46);
  octx.font = `bold ${fontPx}px Arial, sans-serif`;
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.fillText(SHAPE_TEXT, W / 2, H / 2);

  const img = octx.getImageData(0, 0, W, H).data;
  const cellSize = Math.max(20, Math.floor(W / 46));
  const result = [];
  for (let y = cellSize / 2; y < H; y += cellSize) {
    for (let x = cellSize / 2; x < W; x += cellSize) {
      const idx = (Math.floor(y) * W + Math.floor(x)) * 4;
      if (img[idx + 3] > 128) result.push({ x, y, cellSize });
    }
  }
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function rebuildSlotsAndRedraw() {
  slots = buildSlots();
  slotIndex = 0;
  const entries = Array.from(placed.values());
  placed.clear();
  baseCtx.clearRect(0, 0, W, H);
  drawIdleOutline();
  for (const w of entries) assignAndDraw(w.id, w.name, w.featured, true);
}

function drawIdleOutline() {
  if (placed.size > 0) return;
  baseCtx.save();
  baseCtx.font = `bold ${Math.min(H * 0.78, W * 0.46)}px Arial, sans-serif`;
  baseCtx.textAlign = 'center';
  baseCtx.textBaseline = 'middle';
  baseCtx.strokeStyle = 'rgba(255,255,255,0.12)';
  baseCtx.lineWidth = 2;
  baseCtx.strokeText(SHAPE_TEXT, W / 2, H / 2);
  baseCtx.restore();
}

function pickColor(name, featured) {
  if (featured) return FEATURED_COLOR;
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return PALETTE[hash % PALETTE.length];
}

function fitFont(ctx, text, maxWidth, startPx) {
  let size = startPx;
  ctx.font = `600 ${size}px Arial, sans-serif`;
  while (size > 9 && ctx.measureText(text).width > maxWidth) {
    size -= 1;
    ctx.font = `600 ${size}px Arial, sans-serif`;
  }
  return size;
}

function nextSlot() {
  if (slots.length === 0) return { x: W / 2, y: H / 2, cellSize: 40 };
  const s = slots[slotIndex % slots.length];
  slotIndex++;
  return s;
}

function assignAndDraw(id, name, featured, immediate) {
  if (placed.has(id)) return;
  const slot = nextSlot();
  const rot = (Math.random() * 16 - 8) * (Math.PI / 180);
  const color = pickColor(name, featured);
  const targetFontPx = fitFont(
    fxCtx, name,
    slot.cellSize * (featured ? 1.9 : 0.92),
    slot.cellSize * (featured ? 0.85 : 0.55)
  );
  const wordObj = { id, name, x: slot.x, y: slot.y, rot, color, fontPx: targetFontPx, featured: !!featured };
  placed.set(id, wordObj);
  counterEl.textContent = placed.size;

  if (immediate) {
    stampWord(baseCtx, wordObj, 1);
  } else {
    animatingWords.push({ ...wordObj, start: performance.now() });
    ensureLoop();
  }
}

function stampWord(ctx, w, scale) {
  ctx.save();
  ctx.translate(w.x, w.y);
  ctx.rotate(w.rot);
  ctx.scale(scale, scale);
  ctx.font = `600 ${w.fontPx}px Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = w.color;
  ctx.fillText(w.name, 0, 0);
  ctx.restore();
}

function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function loop(now) {
  fxCtx.clearRect(0, 0, W, H);
  let stillActive = false;

  for (let i = animatingWords.length - 1; i >= 0; i--) {
    const w = animatingWords[i];
    const t = Math.min(1, (now - w.start) / POPIN_MS);
    if (t >= 1) {
      stampWord(baseCtx, w, 1);
      animatingWords.splice(i, 1);
    } else {
      stampWord(fxCtx, w, easeOutBack(t));
      stillActive = true;
    }
  }

  if (dimAlpha > 0) {
    fxCtx.save();
    fxCtx.fillStyle = `rgba(0,0,0,${dimAlpha})`;
    fxCtx.fillRect(0, 0, W, H);
    fxCtx.restore();
  }

  if (zoomAnim) {
    const elapsed = now - zoomAnim.start;
    if (elapsed < ZOOM_IN_MS) {
      dimAlpha = Math.min(0.6, (elapsed / ZOOM_IN_MS) * 0.6);
      drawZoomName(zoomAnim, easeOutBack(Math.min(1, elapsed / ZOOM_IN_MS)), 1);
      stillActive = true;
    } else if (elapsed < ZOOM_IN_MS + ZOOM_HOLD_MS) {
      dimAlpha = 0.6;
      drawZoomName(zoomAnim, 1, 1);
      stillActive = true;
    } else if (elapsed < ZOOM_IN_MS + ZOOM_HOLD_MS + ZOOM_OUT_MS) {
      const t = (elapsed - ZOOM_IN_MS - ZOOM_HOLD_MS) / ZOOM_OUT_MS;
      const eased = easeInOutCubic(t);
      dimAlpha = 0.6 * (1 - eased);
      drawZoomName(zoomAnim, 1, 1 - eased);
      stillActive = true;
    } else {
      dimAlpha = 0;
      zoomAnim = null;
    }
  }

  if (titleAnim) {
    const elapsed = now - titleAnim.start;
    const t = Math.min(1, elapsed / TITLE_IN_MS);
    dimAlpha = Math.max(dimAlpha, 0.7);
    
    if (Math.random() < 0.08) fireworks.push(new Firework());
    
    drawTitle(easeOutBack(t));
    stillActive = true;
  }

  for (let i = fireworks.length - 1; i >= 0; i--) {
    fireworks[i].update();
    fireworks[i].draw();
    if (!fireworks[i].alive) fireworks.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].alpha <= 0) particles.splice(i, 1);
  }

  if (stillActive || fireworks.length > 0 || particles.length > 0) {
    requestAnimationFrame(loop);
  } else {
    loopRunning = false;
  }
}

function ensureLoop() {
  if (!loopRunning) {
    loopRunning = true;
    requestAnimationFrame(loop);
  }
}

function drawZoomName(anim, growT, shrinkT) {
  const bigFontPx = Math.min(H * 0.16, W * 0.09);
  const start = { x: W / 2, y: H / 2, fontPx: bigFontPx * 0.15 };
  const big = { x: W / 2, y: H * 0.46, fontPx: bigFontPx };
  const end = { x: anim.targetSlot.x, y: anim.targetSlot.y, fontPx: anim.targetFontPx };

  let x, y, fontPx;
  if (shrinkT === 1) {
    x = start.x + (big.x - start.x) * growT;
    y = start.y + (big.y - start.y) * growT;
    fontPx = start.fontPx + (big.fontPx - start.fontPx) * growT;
  } else {
    const scaleOut = 1 - shrinkT;
    x = big.x + (end.x - big.x) * scaleOut;
    y = big.y + (end.y - big.y) * scaleOut;
    fontPx = big.fontPx + (end.fontPx - big.fontPx) * scaleOut;
  }

  fxCtx.save();
  fxCtx.translate(x, y);
  fxCtx.font = `700 ${fontPx}px Arial, sans-serif`;
  fxCtx.textAlign = 'center';
  fxCtx.textBaseline = 'middle';
  fxCtx.fillStyle = FEATURED_COLOR;
  fxCtx.fillText(anim.name, 0, 0);
  fxCtx.restore();
}

function drawTitle(t) {
  fxCtx.save();
  fxCtx.globalAlpha = Math.min(1, t + 0.15);
  fxCtx.textAlign = 'center';
  fxCtx.textBaseline = 'middle';
  
  // Render TAM Logo Above Title
  if (tamLogo.complete && tamLogo.naturalWidth > 0) {
    const logoTargetWidth = Math.min(W * 0.35, 340);
    const logoScale = logoTargetWidth / tamLogo.naturalWidth;
    const logoW = logoTargetWidth * t;
    const logoH = (tamLogo.naturalHeight * logoScale) * t;
    
    // Draw white background container behind logo for contrast
    fxCtx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    const padX = 20 * t, padY = 10 * t;
    fxCtx.beginPath();
    fxCtx.roundRect(
      W / 2 - logoW / 2 - padX,
      H * 0.28 - logoH / 2 - padY,
      logoW + (padX * 2),
      logoH + (padY * 2),
      12
    );
    fxCtx.fill();

    fxCtx.drawImage(
      tamLogo,
      W / 2 - logoW / 2,
      H * 0.28 - logoH / 2,
      logoW,
      logoH
    );
  }

  // Render Title Text
  const size1 = (Math.min(H * 0.08, W * 0.055)) * (0.2 + 0.8 * t);
  fxCtx.fillStyle = '#ffffff';
  fxCtx.font = `600 ${size1}px Arial, sans-serif`;
  fxCtx.fillText(TITLE_LINE1, W / 2, H * 0.50);
  
  fxCtx.fillStyle = FEATURED_COLOR;
  fxCtx.font = `700 ${size1 * 1.3}px Arial, sans-serif`;
  fxCtx.fillText(TITLE_LINE2, W / 2, H * 0.63);
  
  fxCtx.restore();
}

const source = new EventSource('/api/events');

source.addEventListener('sync', (e) => {
  const data = JSON.parse(e.data);
  placed.clear();
  slotIndex = 0;
  baseCtx.clearRect(0, 0, W, H);
  drawIdleOutline();
  for (const n of data.names) {
    if (!n.hidden) assignAndDraw(n.id, n.name, n.featured, true);
  }
  counterEl.textContent = placed.size;
  applyScene(data.sceneState);
});

source.addEventListener('name:new', (e) => {
  const n = JSON.parse(e.data);
  assignAndDraw(n.id, n.name, n.featured, false);
});

source.addEventListener('name:hidden', (e) => {
  const { id } = JSON.parse(e.data);
  placed.delete(id);
  counterEl.textContent = placed.size;
  rebuildSlotsAndRedraw();
});

source.addEventListener('name:reset', () => {
  placed.clear();
  slotIndex = 0;
  animatingWords = [];
  zoomAnim = null;
  titleAnim = null;
  dimAlpha = 0;
  counterEl.textContent = '0';
  baseCtx.clearRect(0, 0, W, H);
  fxCtx.clearRect(0, 0, W, H);
  drawIdleOutline();
});

source.addEventListener('scene:change', (e) => {
  applyScene(JSON.parse(e.data));
});

function applyScene(scene) {
  if (scene.state === 'frozen') {
    banner = { text: 'The shape is complete!', start: performance.now(), duration: 3000 };
    ensureLoop();
  } else if (scene.state === 'zoom' && scene.payload && scene.payload.name) {
    const target = Array.from(placed.values()).find(
      (w) => w.name.toLowerCase() === scene.payload.name.toLowerCase()
    );
    const targetSlot = target ? { x: target.x, y: target.y } : { x: W / 2, y: H / 2 };
    const targetFontPx = target ? target.fontPx : Math.min(H * 0.78, W * 0.46) * 0.06;
    zoomAnim = { name: scene.payload.name, targetSlot, targetFontPx, start: performance.now() };
    ensureLoop();
  } else if (scene.state === 'title') {
    titleAnim = { start: performance.now() };
    ensureLoop();
  }
}

resize();
</script>
</body>
</html>
