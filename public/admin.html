<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TAM 80th — Admin Control Panel</title>
<style>
  body { font-family: sans-serif; background: #040914; color: #e0f2fe; margin: 0; padding: 24px; }
  h1 { color: #00ffcc; font-size: 24px; margin-bottom: 8px; }
  .card { background: rgba(10, 20, 35, 0.8); border: 1px solid rgba(0, 255, 204, 0.3); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
  input, button { padding: 10px 16px; border-radius: 8px; border: 1px solid rgba(0, 255, 204, 0.4); font-size: 14px; }
  input { background: #020617; color: #fff; }
  button { background: #00ffcc; color: #040914; font-weight: 700; cursor: pointer; transition: 0.2s; }
  button:hover { background: #38bdf8; }
  button.danger { background: #f43f5e; color: #fff; border: none; }
  button.danger:hover { background: #e11d48; }
  .name-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  #name-list { max-height: 350px; overflow-y: auto; margin-top: 12px; }
  .controls-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
</style>
</head>
<body>

  <h1>TAM Penang 80th Anniversary — Control Panel</h1>
  
  <div class="card" id="login-card">
    <h3>Enter Admin PIN</h3>
    <input type="password" id="pin-input" placeholder="PIN (Default: 2026)">
    <button onclick="loadNames()">Login</button>
  </div>

  <div class="card" id="dashboard" style="display:none;">
    <h3>Emcee Quick Controls</h3>
    <div class="controls-grid">
      <button onclick="triggerScene('collecting')">State: Collecting Names</button>
      <button onclick="triggerScene('title')">Trigger Title & Fireworks</button>
      <button onclick="fillRandom(10)">+10 Random Placeholders</button>
      <button class="danger" onclick="resetAll()">Reset All Names</button>
    </div>

    <h3 style="margin-top: 24px;">Live Participant Submissions (<span id="count">0</span>)</h3>
    <div id="name-list"></div>
  </div>

<script>
let currentPin = '';

async function loadNames() {
  currentPin = document.getElementById('pin-input').value;
  const res = await fetch(`/api/admin/names?pin=${currentPin}`);
  if (!res.ok) { alert('Incorrect PIN'); return; }
  
  document.getElementById('login-card').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  fetchNamesLoop();
}

async function fetchNamesLoop() {
  const res = await fetch(`/api/admin/names?pin=${currentPin}`);
  if (res.ok) {
    const data = await res.json();
    renderList(data.names);
  }
  setTimeout(fetchNamesLoop, 3000); // Refresh list every 3s
}

function renderList(names) {
  const listEl = document.getElementById('name-list');
  document.getElementById('count').textContent = names.length;
  if (names.length === 0) { listEl.innerHTML = '<p style="color: #64748b;">No submissions yet.</p>'; return; }
  
  listEl.innerHTML = names.map(n => `
    <div class="name-row">
      <span><strong>${n.name}</strong> ${n.featured ? '⭐ [VIP]' : ''}</span>
      <button class="danger" onclick="deleteName('${n.id}')">Delete</button>
    </div>
  `).join('');
}

async function deleteName(id) {
  if (!confirm('Permanently delete this name?')) return;
  await fetch('/api/admin/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin: currentPin, id })
  });
  loadNames();
}

async function fillRandom(count) {
  await fetch('/api/admin/fill-random', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin: currentPin, count })
  });
  loadNames();
}

async function triggerScene(state) {
  await fetch('/api/admin/scene', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin: currentPin, state })
  });
}

async function resetAll() {
  if (!confirm('WARNING: This will wipe all current names! Proceed?')) return;
  await fetch('/api/admin/scene', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin: currentPin, state: 'reset' })
  });
  loadNames();
}
</script>
</body>
</html>
