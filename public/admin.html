<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceremony admin — TAM Penang 80th</title>
<style>
  :root {
    --bg: #0b1420;
    --surface: #131f2e;
    --surface-2: #1a2836;
    --border: #26374d;
    --text: #eef2f6;
    --text-muted: #8fa0b5;
    --accent: #f2c14e;
    --accent-text: #3a2a06;
    --danger: #d9564c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 24px;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .pin-gate { max-width: 320px; margin: 60px auto; text-align: center; }
  input {
    font-size: 16px; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); width: 100%; box-sizing: border-box; margin-bottom: 10px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    font-size: 14px; font-weight: 600; padding: 11px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: var(--accent-text); cursor: pointer; margin: 4px 8px 4px 0;
  }
  button.secondary { background: var(--surface-2); color: var(--text); }
  button.danger { background: var(--danger); color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  .panel { display: none; max-width: 480px; margin: 0 auto; }
  .panel.show { display: block; }
  .row { margin-bottom: 22px; }
  .count { font-size: 34px; font-weight: 700; }
  .names { max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; margin-top: 10px; }
  .name-item {
    display: flex; justify-content: space-between; align-items: center; padding: 9px 14px;
    border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .name-item:last-child { border-bottom: none; }
  .name-item button { margin: 0; padding: 5px 10px; font-size: 12px; }
  .status { font-size: 13px; color: var(--text-muted); margin-top: 8px; min-height: 18px; }
</style>
</head>
<body>
  <div class="pin-gate" id="pinGate">
    <h1>Ceremony admin</h1>
    <input type="password" id="pinInput" placeholder="Enter PIN">
    <button id="pinBtn">Unlock</button>
    <div class="status" id="pinStatus"></div>
  </div>

  <div class="panel" id="panel">
    <h1>Ceremony admin</h1>

    <div class="row">
      <div class="count" id="count">0</div>
      <div class="status">names on screen</div>
    </div>

    <div class="row">
      <button id="freezeBtn">Freeze cloud ("shape complete!")</button>
    </div>

    <div class="row">
      <input type="text" id="presidentName" placeholder="Ts. President's full name" maxlength="40">
      <button id="zoomBtn">Zoom president's name</button>
    </div>

    <div class="row">
      <button id="titleBtn">Show final title</button>
    </div>

    <div class="row">
      <button class="danger" id="resetBtn">Reset everything</button>
    </div>

    <div class="status" id="actionStatus"></div>

    <div class="row">
      <h1>Submitted names</h1>
      <div class="names" id="namesList"></div>
    </div>
  </div>

<script>
  let PIN = '';
  const pinGate = document.getElementById('pinGate');
  const panel = document.getElementById('panel');
  const pinInput = document.getElementById('pinInput');
  const pinStatus = document.getElementById('pinStatus');
  const countEl = document.getElementById('count');
  const namesList = document.getElementById('namesList');
  const actionStatus = document.getElementById('actionStatus');

  document.getElementById('pinBtn').addEventListener('click', unlock);
  pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });

  async function unlock() {
    PIN = pinInput.value.trim();
    if (!PIN) return;
    pinStatus.textContent = 'Checking…';
    try {
      const res = await fetch('/api/admin/names?pin=' + encodeURIComponent(PIN));
      if (!res.ok) {
        pinStatus.textContent = 'Incorrect PIN.';
        return;
      }
      pinGate.style.display = 'none';
      panel.classList.add('show');
      connect();
    } catch (err) {
      pinStatus.textContent = 'Connection issue — try again.';
    }
  }

  let allNames = [];

  function connect() {
    const source = new EventSource('/api/events');
    source.addEventListener('sync', (e) => {
      const data = JSON.parse(e.data);
      allNames = data.names;
      render();
    });
    source.addEventListener('name:new', (e) => {
      allNames.push(JSON.parse(e.data));
      render();
    });
    source.addEventListener('name:hidden', (e) => {
      const { id } = JSON.parse(e.data);
      const n = allNames.find((x) => x.id === id);
      if (n) n.hidden = true;
      render();
    });
    source.addEventListener('name:reset', () => {
      allNames = [];
      render();
    });
  }

  function render() {
    const visible = allNames.filter((n) => !n.hidden);
    countEl.textContent = visible.length;
    namesList.innerHTML = '';
    for (const n of [...allNames].reverse()) {
      const row = document.createElement('div');
      row.className = 'name-item';
      const label = document.createElement('span');
      label.textContent = n.name + (n.hidden ? ' (hidden)' : '') + (n.featured ? ' \u2605' : '');
      row.appendChild(label);
      if (!n.hidden) {
        const btn = document.createElement('button');
        btn.className = 'secondary';
        btn.textContent = 'Hide';
        btn.addEventListener('click', () => hideName(n.id));
        row.appendChild(btn);
      }
      namesList.appendChild(row);
    }
  }

  async function callScene(state, payload) {
    actionStatus.textContent = 'Sending…';
    try {
      const res = await fetch('/api/admin/scene', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: PIN, state, payload }),
      });
      const data = await res.json();
      actionStatus.textContent = res.ok ? 'Sent.' : (data.error || 'Failed.');
    } catch (err) {
      actionStatus.textContent = 'Connection issue — try again.';
    }
  }

  async function hideName(id) {
    await fetch('/api/admin/hide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: PIN, id }),
    });
  }

  document.getElementById('freezeBtn').addEventListener('click', () => callScene('frozen'));
  document.getElementById('zoomBtn').addEventListener('click', () => {
    const name = document.getElementById('presidentName').value.trim();
    if (!name) { actionStatus.textContent = "Enter the president's name first."; return; }
    callScene('zoom', { name });
  });
  document.getElementById('titleBtn').addEventListener('click', () => callScene('title'));
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('Reset all names and scenes? This cannot be undone.')) callScene('reset');
  });
</script>
</body>
</html>
