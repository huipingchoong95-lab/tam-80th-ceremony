<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TAM 80th — Admin Control Panel</title>
<style>
  body { font-family: sans-serif; background: #040914; color: #e0f2fe; margin: 0; padding: 24px; }
  h1 { color: #00ffcc; font-size: 24px; margin-bottom: 20px; }
  .card { background: rgba(10, 20, 35, 0.8); border: 1px solid rgba(0, 255, 204, 0.3); padding: 24px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 24px rgba(0, 255, 204, 0.1); }
  input, button { padding: 12px 18px; border-radius: 8px; border: 1px solid rgba(0, 255, 204, 0.4); font-size: 14px; font-weight: 600; }
  input { background: #020617; color: #fff; width: 280px; margin-right: 10px; }
  button { background: #00ffcc; color: #040914; cursor: pointer; transition: 0.2s; }
  button:hover { background: #38bdf8; }
  button.danger { background: #f43f5e; color: #fff; border: none; }
  button.danger:hover { background: #e11d48; }
  button.secondary { background: rgba(0, 255, 204, 0.1); color: #00ffcc; border: 1px solid rgba(0, 255, 204, 0.4); }
  button.secondary:hover { background: rgba(0, 255, 204, 0.2); }
  
  .section-title { font-size: 16px; font-weight: 700; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .grid-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  
  .name-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(2, 6, 23, 0.5); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; margin-bottom: 8px; }
  #name-list { max-height: 400px; overflow-y: auto; margin-top: 12px; padding-right: 4px; }
  .badge { background: rgba(242, 193, 78, 0.2); color: #f2c14e; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 8px; border: 1px solid rgba(242, 193, 78, 0.4); }
</style>
</head>
<body>

  <h1>TAM Penang 80th Anniversary — Control Panel</h1>
  
  <div class="card" id="login-card">
    <div class="section-title">Authentication Required</div>
    <div style="display: flex; align-items: center;">
      <input type="password" id="pin-input" placeholder="Enter Admin PIN (Default: 2026)">
      <button onclick="loadNames()">Access Panel</button>
    </div>
  </div>

  <div class="card" id="dashboard" style="display:none;">
    
    <!-- Emcee & Display Controls -->
    <div class="section-title">Emcee & Display Controls</div>
    <div class="grid-controls" style="margin-bottom: 24px;">
      <button class="secondary" onclick="triggerScene('collecting')">Resume Live Wall</button>
      <button onclick="triggerScene('title')">Show Title & Fireworks</button>
      <button class="secondary" onclick="fillRandom(10)">+10 Random Placeholders</button>
      <button class="danger" onclick="resetAll()">Reset All Names</button>
    </div>

    <!-- VIP / President Zoom Feature -->
    <div class="section-title" style="margin-top: 24px;">VIP / President Spotlight Zoom</div>
    <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 8px;">
      <input type="text" id="zoom-name-input" placeholder="Enter VIP Name (e.g. Ts. Soon)" style="flex: 1; min-width: 240px; margin-right: 0;">
      <button onclick="triggerZoom()">Trigger VIP Zoom</button>
    </div>

    <!-- Live Submissions List -->
    <div class="section-title" style="margin-top: 28px;">Live Participant Submissions (<span id="count">0</span>)</div>
    <div id="name-list"></div>

  </div>

<script>
let currentPin = '';

async function loadNames() {
  currentPin = document.getElementById('pin-input').value;
  const res = await fetch(`/api/admin/names?pin=${currentPin}`);
  if (!res.ok) { alert('Incorrect PIN'); return; }
  
  document.getElementById('login-card').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  fetchNamesLoop();
}

async function fetchNamesLoop() {
  const res = await fetch(`/api/admin/names?pin=${currentPin}`);
  if (res.ok) {
    const data = await res.json();
    renderList(data.names);
  }
  setTimeout(fetchNamesLoop, 3000);
}

function renderList(names) {
  const listEl = document.getElementById('name-list');
  document.getElementById('count').textContent = names.length;
  if (names.length === 0) { listEl.innerHTML = '<p style="color: #64748b; font-style: italic;">No submissions yet.</p>'; return; }
  
  listEl.innerHTML = names.map(n => `
    <div class="name-row">
      <span><strong>${n.name}</strong> ${n.featured ? '<span class="badge">VIP / Featured</span>' : ''}</span>
      <button class="danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteName('${n.id}')">Delete</button>
    </div>
  `).join('');
}

async function deleteName(id) {
  if (!confirm('Permanently delete this name from the display?')) return;
  await fetch('/api/admin/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin: currentPin, id })
  });
  loadNames();
}

async function fillRandom(count) {
  await fetch('/api/admin/fill-random', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin: currentPin, count })
  });
  loadNames();
}

async function triggerScene(state) {
  await fetch('/api/admin/scene', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin: currentPin, state })
  });
}

async function triggerZoom() {
  const name = document.getElementById('zoom-name-input').value.trim();
  if (!name) { alert('Please enter a name for the VIP zoom.'); return; }
  
  await fetch('/api/admin/scene', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin: currentPin, state: 'zoom', payload: { name } })
  });
  document.getElementById('zoom-name-input').value = '';
  loadNames();
}

async function resetAll() {
  if (!confirm('WARNING: This will completely wipe all current names from the screen! Proceed?')) return;
  await fetch('/api/admin/scene', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin: currentPin, state: 'reset' })
  });
  loadNames();
}
</script>
</body>
</html>
