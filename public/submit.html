<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAM Penang 80th Anniversary — Join the Shape</title>
<style>
  body { 
    font-family: sans-serif; 
    background: #040914; 
    color: #e0f2fe; 
    margin: 0; 
    padding: 24px; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    box-sizing: border-box; 
  }
  .card { 
    background: rgba(10, 20, 35, 0.9); 
    border: 1px solid rgba(0, 255, 204, 0.3); 
    padding: 36px 24px; 
    border-radius: 20px; 
    width: 100%; 
    max-width: 400px; 
    box-shadow: 0 8px 32px rgba(0, 255, 204, 0.15); 
    text-align: center; 
    backdrop-filter: blur(12px);
  }
  .logo-text { 
    font-size: 13px; 
    font-weight: 700; 
    color: #00ffcc; 
    letter-spacing: 1.5px; 
    text-transform: uppercase; 
    margin-bottom: 8px; 
  }
  h1 { 
    color: #ffffff; 
    font-size: 24px; 
    margin: 0 0 8px 0; 
  }
  p { 
    color: #94a3b8; 
    font-size: 14px; 
    margin-bottom: 24px; 
    line-height: 1.5; 
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  input { 
    width: 100%; 
    padding: 16px; 
    border-radius: 12px; 
    border: 1px solid rgba(0, 255, 204, 0.4); 
    background: #020617; 
    color: #fff; 
    font-size: 16px; 
    box-sizing: border-box; 
    outline: none; 
    text-align: center; 
    transition: 0.2s;
  }
  input:focus { 
    border-color: #38bdf8; 
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.3); 
  }
  button { 
    width: 100%; 
    padding: 16px; 
    border-radius: 12px; 
    border: none; 
    background: #00ffcc; 
    color: #040914; 
    font-size: 16px; 
    font-weight: 700; 
    cursor: pointer; 
    transition: 0.2s; 
    box-shadow: 0 4px 16px rgba(0, 255, 204, 0.3);
  }
  button:hover { 
    background: #38bdf8; 
    box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
  }
  button:active {
    transform: scale(0.98);
  }
  #message { 
    margin-top: 16px; 
    font-size: 14px; 
    font-weight: 600; 
    min-height: 24px; 
    transition: 0.3s;
  }
  .success { color: #00ffcc; }
  .error { color: #f43f5e; }
</style>
</head>
<body>

  <div class="card">
    <div class="logo-text">TAM Penang 80th Anniversary</div>
    <h1>Join the Network</h1>
    <p>Enter your name or handle to anchor your node into the live display shape.</p>
    
    <form id="submit-form" onsubmit="submitName(event)">
      <input type="text" id="name-input" placeholder="Your Name or Nickname" maxlength="40" autocomplete="off" required>
      <button type="submit" id="submit-btn">Submit Name</button>
    </form>
    
    <div id="message"></div>
  </div>

<script>
async function submitName(event) {
  event.preventDefault();
  const input = document.getElementById('name-input');
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('message');
  const name = input.value.trim();

  if (!name) return;

  btn.disabled = true;
  btn.style.opacity = '0.6';
  msg.textContent = 'Transmitting node...';
  msg.className = '';

  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    
    const data = await res.json();
    
    if (res.ok) {
      msg.textContent = 'Successfully joined the network!';
      msg.className = 'success';
      input.value = '';
      setTimeout(() => { msg.textContent = ''; }, 4000);
    } else {
      msg.textContent = data.error || 'Submission failed. Try again.';
      msg.className = 'error';
    }
  } catch (err) {
    msg.textContent = 'Network error. Please check your connection.';
    msg.className = 'error';
  } finally {
    btn.disabled = false;
    btn.style.opacity = '1';
  }
}
</script>
</body>
</html>
