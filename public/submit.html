<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAM Penang 80th Anniversary — Join the Wall</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #040914; overflow: hidden; font-family: sans-serif; color: #e0f2fe; }
  canvas { position: absolute; top: 0; left: 0; }
  #bg { z-index: 1; }
  #fx { z-index: 2; pointer-events: none; }

  .container {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; padding: 20px;
  }

  .card {
    background: rgba(10, 20, 35, 0.75); backdrop-filter: blur(16px);
    border: 1px solid rgba(0, 255, 204, 0.35); padding: 32px 28px; border-radius: 20px;
    width: 100%; max-width: 440px; box-shadow: 0 8px 32px rgba(0, 255, 204, 0.15);
    text-align: center; position: relative; overflow: hidden;
  }

  h1 { color: #00ffcc; font-size: 22px; margin-top: 0; margin-bottom: 8px; letter-spacing: 0.5px; text-shadow: 0 0 10px rgba(0,255,204,0.4); }
  p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }

  .input-group { margin-bottom: 20px; text-align: left; }
  label { display: block; font-size: 12px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  
  input {
    width: 100%; padding: 14px 16px; border-radius: 10px;
    background: #020617; border: 1px solid rgba(0, 255, 204, 0.4);
    color: #fff; font-size: 15px; font-weight: 600; outline: none; transition: 0.2s;
  }
  input:focus { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); }

  button {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: #00ffcc; color: #040914; font-size: 15px; font-weight: 800;
    cursor: pointer; transition: 0.2s; margin-top: 4px; letter-spacing: 0.5px;
    box-shadow: 0 4px 16px rgba(0, 255, 204, 0.3);
  }
  button:hover { background: #38bdf8; box-shadow: 0 4px 20px rgba(56, 189, 248, 0.5); }
  button:disabled { background: #334155; color: #64748b; cursor: not-allowed; box-shadow: none; }

  #console-log {
    margin-top: 14px; font-family: monospace; font-size: 11px; color: #34d399; min-height: 18px;
    text-shadow: 0 0 6px rgba(52, 211, 153, 0.4); word-break: break-all;
  }

  .flash-burst {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(0,255,204,0.8) 0%, rgba(0,255,204,0) 70%);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out;
  }

  /* Medium-speed smooth energy orb transition */
  .energy-orb {
    position: fixed; z-index: 999;
    background: radial-gradient(circle, #ffffff 0%, #00ffcc 50%, #0284c7 100%);
    color: #040914; font-weight: 800; font-size: 13px;
    padding: 10px 20px; border-radius: 50px;
    box-shadow: 0 0 35px #00ffcc, 0 0 18px #ffffff, inset 0 0 12px #ffffff;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.1);
    opacity: 0;
    transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease-in-out;
  }

  .watermark {
    position: absolute; bottom: 16px; font-size: 12px; color: rgba(0, 255, 204, 0.4);
    font-weight: 500; letter-spacing: 0.5px; pointer-events: none;
  }
</style>
</head>
<body>

  <canvas id="bg"></canvas>
  <canvas id="fx"></canvas>

  <div class="container">
    <div class="card" id="form-card">
      <div class="flash-burst" id="flash"></div>
      <h1>TAM 80th Anniversary</h1>
      <p class="subtitle">Connect your node to the live celebration wall</p>
      
      <form id="submit-form" onsubmit="handleTransmit(event)">
        <div class="input-group">
          <label>Your Name</label>
          <input type="text" id="name-input" placeholder="e.g. Ir. Ahmad bin Abdullah" required autocomplete="off">
        </div>

        <button type="submit" id="transmit-btn">Transmit Node to Wall</button>
      </form>

      <div id="console-log"></div>
    </div>
  </div>

  <div class="watermark">Designed & Developed by Ts. Choong Hui Ping</div>

<script>
const bgCanvas = document.getElementById('bg');
const fxCanvas = document.getElementById('fx');
const bgCtx = bgCanvas.getContext('2d');
const fxCtx = fxCanvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let netNodes = [];

for(let i=0; i<60; i++) {
  netNodes.push({ x: Math.random(), y: Math.random(), vx: (Math.random()-0.5)*0.001, vy: (Math.random()-0.5)*0.001 });
}

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [bgCanvas, fxCanvas]) {
    c.width = W * DPR; c.height = H * DPR;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    c.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
  }
}
window.addEventListener('resize', resize);
resize();

function animate() {
  bgCtx.clearRect(0, 0, W, H);
  bgCtx.lineWidth = 2;

  for(let i=0; i<netNodes.length; i++) {
    let n = netNodes[i];
    n.x += n.vx; n.y += n.vy;
    if(n.x < 0 || n.x > 1) n.vx *= -1;
    if(n.y < 0 || n.y > 1) n.vy *= -1;
    
    let px = n.x * W, py = n.y * H;
    bgCtx.fillStyle = '#00ffcc';
    bgCtx.shadowColor = 'rgba(0, 255, 204, 0.8)';
    bgCtx.shadowBlur = 6;
    bgCtx.beginPath(); bgCtx.arc(px, py, 3, 0, Math.PI*2); bgCtx.fill();
    bgCtx.shadowBlur = 0;
    
    for(let j=i+1; j<netNodes.length; j++) {
      let n2 = netNodes[j];
      let p2x = n2.x * W, p2y = n2.y * H;
      let dist = Math.hypot(px - p2x, py - p2y);
      if(dist < 180) {
        bgCtx.strokeStyle = `rgba(0, 255, 204, ${0.35 * (1 - dist/180)})`;
        bgCtx.beginPath(); bgCtx.moveTo(px, py); bgCtx.lineTo(p2x, p2y); bgCtx.stroke();
      }
    }
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

async function handleTransmit(e) {
  e.preventDefault();
  const inputEl = document.getElementById('name-input');
  const nameVal = inputEl.value.trim();
  const btn = document.getElementById('transmit-btn');
  const log = document.getElementById('console-log');
  const flashEl = document.getElementById('flash');

  if (!nameVal) return;

  btn.disabled = true;
  log.style.color = '#38bdf8';
  log.textContent = `[SYN] Initializing quantum packet stream...`;

  flashEl.style.opacity = '1';
  setTimeout(() => { flashEl.style.opacity = '0'; }, 2505);

  const inputRect = inputEl.getBoundingClientRect();
  const startX = inputRect.left + inputRect.width / 2;
  const startY = inputRect.top + inputRect.height / 2;

  const orb = document.createElement('div');
  orb.className = 'energy-orb';
  orb.textContent = nameVal;
  orb.style.left = `${startX}px`;
  orb.style.top = `${startY}px`;
  document.body.appendChild(orb);

  requestAnimationFrame(() => {
    orb.style.opacity = '1';
    orb.style.transform = 'translate(-50%, -50%) scale(1)';
  });

  // Medium speed rocket trajectory
  setTimeout(() => {
    orb.style.transform = 'translate(-50%, -150vh) scale(0.4)';
    orb.style.opacity = '0';
  }, 400);

  try {
    const res = await fetch('/api/names', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: nameVal })
    });

    if (res.ok) {
      log.style.color = '#34d399';
      log.textContent = `[ACK 200 OK] Energy node launched to display wall!`;
      inputEl.value = '';
    } else {
      const errData = await res.json().catch(() => ({}));
      log.style.color = '#f43f5e';
      log.textContent = `[ERROR ${res.status}] ${errData.error || 'Server rejected transmission.'}`;
    }
  } catch (err) {
    log.style.color = '#f43f5e';
    log.textContent = `[TIMEOUT] Network unreachable.`;
  }

  setTimeout(() => orb.remove(), 1600);

  setTimeout(() => {
    btn.disabled = false;
    log.textContent = '';
  }, 3000);
}
</script>
</body>
</html>
