<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TAM Penang — 80th anniversary</title>
<style>
  :root {
    --bg: #0b1420;
    --surface: #131f2e;
    --border: #26374d;
    --text: #eef2f6;
    --text-muted: #8fa0b5;
    --accent: #f2c14e;
    --accent-text: #3a2a06;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px;
  }
  .card { width: 100%; max-width: 380px; text-align: center; }
  .mark {
    width: 56px; height: 56px; border: 2px solid var(--accent); border-radius: 50%;
    margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 600; color: var(--accent);
  }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 6px; }
  p.sub { color: var(--text-muted); margin: 0 0 28px; font-size: 14px; line-height: 1.5; }
  input[type=text] {
    width: 100%; font-size: 17px; padding: 14px 16px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; color: var(--text);
    margin-bottom: 14px; text-align: center;
  }
  input[type=text]::placeholder { color: var(--text-muted); }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; font-size: 16px; font-weight: 600; padding: 14px; border: none; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button:disabled { background: var(--border); color: var(--text-muted); }
  .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
  .msg.error { color: #f28b82; }
  .done { display: none; }
  .done.show { display: block; }
  .form.hide { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="form" id="form">
      <div class="mark">80</div>
      <h1>TAM Penang, 80th anniversary</h1>
      <p class="sub">Add your name to the wall — watch it appear on the big screen.</p>
      <input type="text" id="nameInput" maxlength="40" placeholder="Your name" autocomplete="name">
      <button id="submitBtn">Add my name</button>
      <div class="msg" id="msg"></div>
    </div>
    <div class="done" id="done">
      <div class="mark">80</div>
      <h1>You're on the wall</h1>
      <p class="sub">Look up at the big screen to find your name.</p>
    </div>
  </div>

<script>
  const form = document.getElementById('form');
  const done = document.getElementById('done');
  const input = document.getElementById('nameInput');
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');

  btn.addEventListener('click', submitName);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitName(); });

  async function submitName() {
    const name = input.value.trim();
    if (!name) {
      msg.textContent = 'Enter your name first.';
      msg.className = 'msg error';
      return;
    }
    btn.disabled = true;
    msg.textContent = '';
    try {
      const res = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      const data = await res.json();
      if (!res.ok) {
        msg.textContent = data.error || 'Something went wrong — try again.';
        msg.className = 'msg error';
        btn.disabled = false;
        return;
      }
      form.classList.add('hide');
      done.classList.add('show');
    } catch (err) {
      msg.textContent = 'Connection issue — try again.';
      msg.className = 'msg error';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
